services:
  app:
    build:
      context: .
      args:
        - UID=${HOST_UID:-1000}
        - GID=${HOST_GID:-1000}
    container_name: mtg-search
    ports:
      - "${PORT:-5000}:5000"
      - "${MCP_SSE_PORT:-8765}:8765"
      - "${MCPO_PORT:-8000}:8000"
    volumes:
      - ./AllPrintings.sqlite:/app/AllPrintings.sqlite
      - ./embeddings:/app/embeddings
      - ./images:/app/images
      - ./eval_reports:/app/eval_reports
      - ./.secret_key:/app/.secret_key
      - ./.last_ingest.json:/app/.last_ingest.json
      # ponytail: dev overlays — edit code on host, reflected live in container
      - ./app.py:/app/app.py
      - ./mtg:/app/mtg
      - ./requirements.txt:/app/requirements.txt
      - ./static:/app/static
      - ./templates:/app/templates
      - ./decks:/app/decks
      - ./card_templates:/app/card_templates
      - ./prices:/app/prices
    environment:
      - SEARXNG_URL=http://searxng:8080
      - LLM_BACKEND=${LLM_BACKEND:-openai}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - MCP_SSE_PORT=${MCP_SSE_PORT:-8765}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCPO_PORT=${MCPO_PORT:-8000}
    restart: unless-stopped
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    container_name: mtg-searxng
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8888}:8080"
    volumes:
      - ./searxng/:/etc/searxng/
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET?SEARXNG_SECRET is required}
    restart: unless-stopped
